server {
    server_name _;
    listen 80 default_server;

    # Log to the container's stdout/stderr rather than to files inside it, so
    # "docker compose logs" shows them and nothing accumulates on a layer no one
    # ever reads.
    access_log /dev/stdout;
    error_log /dev/stderr;

    root /app;

    # Every build fingerprints these filenames (outputHashing: all), so a given
    # URL always names the same bytes and can be cached indefinitely.
    # Not "expires 1y", which emits a Cache-Control of its own and would leave
    # two conflicting headers on the response.
    location ~* \.(?:js|css|woff2?|svg|jpg|jpeg|png|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        index index.html;
        # The router owns the URL space, so anything that is not a real file has
        # to come back as index.html for the application to route it.
        try_files $uri $uri/index.html /index.html;

        # index.html is the one unfingerprinted file, and it is what points at
        # the current bundle. Caching it would pin clients to an old release.
        add_header Cache-Control "no-cache";
    }
}
